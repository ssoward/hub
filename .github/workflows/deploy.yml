name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Do NOT cancel a run already in progress —
# cancelling mid-publish can abort a production deployment partway through.
# This matches GitHub's own Pages starter workflow.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No build step: this is a pure static site with zero npm dependencies
      # (package.json declares none, and "npm run build" is an echo). The
      # previous setup-node + npm ci + npm run build steps did no work and
      # only added failure surface.

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
